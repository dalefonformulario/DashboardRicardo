<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalefon - Dashboard & Rúbrica</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'spin-slow': 'spin 2s linear infinite',
            'slide-up': 'slideUp 0.4s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(40px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFDFF] dark:bg-slate-900 transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconSvg = ({ children, className = "w-5 h-5", size, strokeWidth = "2", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        width={size || "24"}
        height={size || "24"}
        {...props}
      >
        {children}
      </svg>
    );

    // Lucide Icons
    const Phone = (props) => <IconSvg {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconSvg>;
    const MessageCircle = (props) => <IconSvg {...props}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconSvg>;
    const ArrowLeft = (props) => <IconSvg {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconSvg>;
    const ArrowRight = (props) => <IconSvg {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconSvg>;
    const Moon = (props) => <IconSvg {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconSvg>;
    const Sun = (props) => <IconSvg {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconSvg>;
    const RefreshCw = (props) => <IconSvg {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconSvg>;
    const LayoutDashboard = (props) => <IconSvg {...props}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconSvg>;
    const Lock = (props) => <IconSvg {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconSvg>;

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(false);

      // Auth States
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginEmail, setLoginEmail] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [loginError, setLoginError] = useState("");

      // Data States
      const [dashLoading, setDashLoading] = useState(false);
      const [dashData, setDashData] = useState(null);
      const [dashMes, setDashMes] = useState("");
      const [llamadasRawData, setLlamadasRawData] = useState(null);
      const [fetchError, setFetchError] = useState(null);

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail === "ricardo.sanchez@dalefon.mx" && loginPassword === "Risaco25") {
          setIsAuthenticated(true);
          setLoginError("");
        } else {
          setLoginError("Correo o contraseña incorrectos.");
        }
      };

      const fetchRealData = async () => {
        setDashLoading(true);
        setFetchError(null);
        try {
          // Enlace de Google Apps Script
          const response = await fetch("https://script.google.com/macros/s/AKfycbyOF0suZ4INbrCBN0tQvQ3nXLe1pLUIJR5LbfjkkqtffnLhPFkU7m0VhaP3c9yYOWUp/exec");
          const json = await response.json();

          if (json.status === "success") {
            if (json.dashboard) {
              setDashData(json.dashboard.data || []);
              setDashMes(json.dashboard.mes || "");
              setLlamadasRawData(json.llamadas || []);
            } else if (json.data) {
              setDashData(json.data);
              setDashMes(json.mes);
            }
          } else {
            setFetchError("Error en la estructura de datos. Verifica tu Google Sheet.");
          }
        } catch (error) {
          console.error("Error fetching data:", error);
          setFetchError("Error al conectar con Google Sheets. Verifica los permisos de tu Script.");
        } finally {
          setDashLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated && (activeTab === 'dashboard' || activeTab === 'azul' || activeTab === 'rosa')) {
          if (!dashData || !llamadasRawData) {
            fetchRealData();
          }
        }
      }, [activeTab, isAuthenticated]);

      // ============================================================
      // LOGIN MODAL
      // ============================================================
      const renderLoginModal = () => (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-md transition-all p-4">
          <div className="bg-white dark:bg-slate-800 p-8 md:p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border-t-[8px] border-[#3C1053] animate-slide-up relative overflow-hidden">
            <div className="absolute top-0 right-0 w-32 h-32 bg-fuchsia-50 dark:bg-fuchsia-900/10 rounded-full -mr-16 -mt-16 opacity-60"></div>
            
            <div className="relative z-10 flex flex-col items-center">
              <div className="p-4 bg-fuchsia-100 dark:bg-fuchsia-900/40 text-[#3C1053] dark:text-fuchsia-300 rounded-full mb-6">
                <Lock size={32} />
              </div>
              
              <h2 className="text-3xl font-black text-[#3C1053] dark:text-fuchsia-50 tracking-tighter mb-2">
                Acceso Dalefon
              </h2>
              <p className="text-gray-500 dark:text-gray-400 text-center mb-8 font-medium">
                Ingresa tus credenciales para ver tu panel de calidad.
              </p>

              <form onSubmit={handleLogin} className="w-full space-y-5">
                <div>
                  <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Correo Electrónico</label>
                  <input 
                    type="email" 
                    value={loginEmail}
                    onChange={(e) => setLoginEmail(e.target.value)}
                    placeholder="... @dalefon.mx"
                    className="w-full px-5 py-3.5 bg-gray-50 dark:bg-slate-900 border-2 border-gray-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-[#3C1053] dark:focus:border-fuchsia-500 transition-colors text-gray-800 dark:text-gray-100 font-medium"
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 ml-1">Contraseña</label>
                  <input 
                    type="password" 
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full px-5 py-3.5 bg-gray-50 dark:bg-slate-900 border-2 border-gray-200 dark:border-slate-700 rounded-2xl focus:outline-none focus:border-[#3C1053] dark:focus:border-fuchsia-500 transition-colors text-gray-800 dark:text-gray-100 font-medium"
                    required
                  />
                </div>

                {loginError && (
                  <p className="text-red-500 text-sm font-bold text-center animate-fade-in bg-red-50 dark:bg-red-900/20 p-2 rounded-lg">
                    {loginError}
                  </p>
                )}

                <button 
                  type="submit"
                  className="w-full bg-[#3C1053] hover:bg-[#2A0B3A] text-white font-bold text-lg py-4 rounded-2xl transition-colors shadow-lg shadow-purple-900/20 mt-4"
                >
                  Entrar al Dashboard
                </button>
              </form>
            </div>
          </div>
        </div>
      );

      // ============================================================
      // HOME
      // ============================================================
      const renderHome = () => (
        <div className="animate-fade-in space-y-10 pb-20">
          <div className="text-center space-y-4 pt-10 px-4">
            <h1 className="text-6xl font-black text-[#3C1053] dark:text-fuchsia-100 tracking-tighter transition-colors">
              RUBRO DE <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#00E5FF] via-[#7B1FA2] to-[#FF00FF]">CALIDAD</span>
            </h1>
            <p className="text-gray-500 dark:text-gray-400 font-medium text-lg transition-colors">Gestiona y consulta las métricas de desempeño de Dalefon.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto px-6">
            <button
              onClick={() => setActiveTab('dashboard')}
              className="md:col-span-2 group relative bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-900/20 dark:to-teal-900/20 border-t-[6px] border-emerald-500 rounded-[2.5rem] p-10 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden"
            >
              <div className="absolute top-0 right-0 w-48 h-48 bg-white/40 dark:bg-black/10 rounded-full -mr-16 -mt-16 opacity-60 group-hover:scale-110 transition-transform"></div>
              <div className="relative z-10 flex flex-col md:flex-row items-center md:items-start md:space-x-8 text-center md:text-left gap-6 md:gap-0">
                <div className="p-6 bg-emerald-100 dark:bg-emerald-900/60 text-emerald-600 dark:text-emerald-400 rounded-3xl group-hover:bg-emerald-500 group-hover:text-white transition-colors shadow-sm">
                  <LayoutDashboard size={56} strokeWidth={1.5} />
                </div>
                <div className="space-y-3 flex-1">
                  <h2 className="text-4xl font-black text-emerald-800 dark:text-emerald-300 tracking-tight">
                    Mi Dashboard <span className="text-sm bg-emerald-200 dark:bg-emerald-800 text-emerald-800 dark:text-emerald-100 px-3 py-1 rounded-full ml-2 align-middle">En Vivo</span>
                  </h2>
                  <p className="text-emerald-700/80 dark:text-emerald-200/80 font-medium text-lg leading-tight">
                    Consulta tus métricas de puntualidad, llamadas, asistencias y calificación de cliente.
                  </p>
                  <div className="pt-2 flex items-center justify-center md:justify-start text-emerald-600 dark:text-emerald-400 font-bold text-lg group-hover:translate-x-2 transition-transform">
                    Acceder al Panel <ArrowRight className="ml-2 w-5 h-5" />
                  </div>
                </div>
              </div>
            </button>

            <button
              onClick={() => setActiveTab('azul')}
              className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-[#00E5FF] rounded-[2.5rem] p-10 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden"
            >
              <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-50 dark:bg-cyan-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
              <div className="relative z-10 flex items-start space-x-6">
                <div className="p-5 bg-cyan-50 dark:bg-cyan-900/40 text-cyan-600 dark:text-cyan-400 rounded-3xl group-hover:bg-[#00E5FF] group-hover:text-white transition-colors">
                  <Phone size={44} strokeWidth={1.5} />
                </div>
                <div className="space-y-2">
                  <h2 className="text-4xl font-bold text-[#3C1053] dark:text-fuchsia-50">Hola, soy <span className="text-[#0097A7] dark:text-cyan-400">Azul</span></h2>
                  <p className="text-gray-500 dark:text-gray-400 font-medium text-lg leading-tight">Resultados y matriz de evaluación en <span className="font-bold">Llamadas</span>.</p>
                </div>
              </div>
            </button>

            <button
              onClick={() => setActiveTab('rosa')}
              className="group relative bg-white dark:bg-slate-800 border-t-[6px] border-[#FF00FF] rounded-[2.5rem] p-10 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-2 text-left overflow-hidden"
            >
              <div className="absolute top-0 right-0 w-32 h-32 bg-pink-50 dark:bg-pink-900/30 rounded-full -mr-10 -mt-10 opacity-60 group-hover:scale-110 transition-transform"></div>
              <div className="relative z-10 flex items-start space-x-6">
                <div className="p-5 bg-pink-50 dark:bg-pink-900/40 text-pink-600 dark:text-pink-400 rounded-3xl group-hover:bg-[#FF00FF] group-hover:text-white transition-colors">
                  <MessageCircle size={44} strokeWidth={1.5} />
                </div>
                <div className="space-y-2">
                  <h2 className="text-4xl font-bold text-[#3C1053] dark:text-fuchsia-50">Hola, soy <span className="text-[#C51162] dark:text-pink-400">Rosa</span></h2>
                  <p className="text-gray-500 dark:text-gray-400 font-medium text-lg leading-tight">Tu ejecutiva de calidad en <span className="font-bold">Chats</span>.</p>
                </div>
              </div>
            </button>
          </div>
        </div>
      );

      // ============================================================
      // DASHBOARD
      // ============================================================
      const renderDashboard = () => {
        return (
          <div className="animate-fade-in max-w-6xl mx-auto px-4 pb-20">
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 print:hidden">
              <button onClick={() => setActiveTab('home')} className="flex w-max items-center text-gray-500 dark:text-gray-400 font-bold hover:text-[#3C1053] dark:hover:text-fuchsia-300 transition-colors">
                <ArrowLeft className="mr-2 w-6 h-6" /> Volver al Inicio
              </button>

              <button
                onClick={fetchRealData}
                disabled={dashLoading}
                className="flex w-max items-center bg-white dark:bg-slate-800 border-2 border-indigo-100 dark:border-slate-700 px-6 py-3 rounded-full text-[#3C1053] dark:text-fuchsia-300 font-black text-sm uppercase tracking-wider hover:shadow-lg hover:border-[#7B1FA2] transition-all disabled:opacity-50"
              >
                actualiza tus datos dalefonescos
                <RefreshCw className={`ml-3 w-5 h-5 text-[#7B1FA2] dark:text-fuchsia-400 ${dashLoading ? 'animate-spin' : ''}`} />
              </button>
            </div>

            {dashLoading && !dashData ? (
              <div className="flex flex-col items-center justify-center py-20 text-emerald-600">
                <RefreshCw className="animate-spin-slow w-12 h-12 mb-4" />
                <p className="font-bold">Descargando datos desde Google Sheets...</p>
              </div>
            ) : fetchError ? (
              <div className="text-center py-10 text-red-500 font-bold">{fetchError}</div>
            ) : dashData && dashData.length > 0 ? (
              (() => {
                const targetRow = dashData.find(row => row["Nombre"] === "Ricardo Sánchez Cortés") || dashData[0] || {};

                const formatMax3 = (val) => {
                  if (typeof val === 'number') {
                    return Number.isInteger(val) ? val : parseFloat(val.toFixed(3));
                  }
                  if (typeof val === 'string' && !isNaN(val) && val.includes('.')) {
                    return parseFloat(parseFloat(val).toFixed(3));
                  }
                  return val;
                };

                let colB_val = targetRow["Puntualidad"] !== undefined ? targetRow["Puntualidad"] : '0';
                if (typeof colB_val === 'number') { colB_val = parseFloat((colB_val * 100).toFixed(3)) + '%'; }

                const colC_val = targetRow["Faltas"] !== undefined ? formatMax3(targetRow["Faltas"]) : '0';
                const colD_val = targetRow["Minimo de asistencias"] !== undefined ? formatMax3(targetRow["Minimo de asistencias"]) : '0';
                const colE_val = targetRow["asistencias realizadas"] !== undefined ? formatMax3(targetRow["asistencias realizadas"]) : '0';
                const colF_val = targetRow["Meta de llamadas"] !== undefined ? formatMax3(targetRow["Meta de llamadas"]) : '0';

                let colG_val = targetRow["Calf del cliente"] !== undefined ? targetRow["Calf del cliente"] : '0';
                if (typeof colG_val === 'number') { colG_val = parseFloat(colG_val.toFixed(3)); }
                else { colG_val = formatMax3(colG_val); }

                // Nuevas variables (Vacaciones y Días Económicos)
                const colH_val = targetRow["vacaciones"] !== undefined ? formatMax3(targetRow["vacaciones"]) : '0';
                const colI_val = targetRow["dias economicos"] !== undefined ? formatMax3(targetRow["dias economicos"]) : '0';

                return (
                  <div className="space-y-12">
                    <div className="text-center space-y-4 mb-10">
                      <h2 className="text-4xl md:text-5xl font-black text-[#3C1053] dark:text-fuchsia-50 tracking-tighter">
                        Bienvenida Ricardo Sánchez Cortés
                      </h2>
                      <h3 className="text-xl md:text-2xl font-bold text-gray-500 dark:text-gray-400">
                        Este es tu dashboard del mes de <span className="text-cyan-500 uppercase">{dashMes || 'Mes no detectado'}</span>
                      </h3>
                    </div>

                    <div className="space-y-6">
                      {/* Fila 1: Tiempo Libre y Puntualidad (3 columnas) */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-[#3C1053] rounded-[2.5rem] p-10 shadow-2xl text-center transform hover:-translate-y-2 transition-transform">
                          <p className="text-fuchsia-200 text-sm font-bold uppercase tracking-widest mb-3">Puntualidad</p>
                          <p className="text-6xl font-black text-white">{colB_val}</p>
                        </div>
                        <div className="bg-gradient-to-br from-amber-400 to-orange-500 rounded-[2.5rem] p-10 shadow-2xl text-center transform hover:-translate-y-2 transition-transform">
                          <p className="text-amber-100 text-sm font-bold uppercase tracking-widest mb-3">Vacaciones</p>
                          <p className="text-6xl font-black text-white">{colH_val}</p>
                        </div>
                        <div className="bg-gradient-to-br from-sky-400 to-blue-600 rounded-[2.5rem] p-10 shadow-2xl text-center transform hover:-translate-y-2 transition-transform">
                          <p className="text-sky-100 text-sm font-bold uppercase tracking-widest mb-3">Días Económicos</p>
                          <p className="text-6xl font-black text-white">{colI_val}</p>
                        </div>
                      </div>

                      {/* Fila 2: Asistencia y Faltas (3 columnas) */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-[#3C1053] rounded-[2.5rem] p-10 shadow-2xl text-center transform hover:-translate-y-2 transition-transform">
                          <p className="text-fuchsia-200 text-sm font-bold uppercase tracking-widest mb-3">Faltas</p>
                          <p className="text-6xl font-black text-white">{colC_val}</p>
                        </div>
                        <div className="bg-gradient-to-br from-cyan-500 to-blue-600 rounded-[2.5rem] p-10 shadow-xl text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform">
                          <p className="text-cyan-100 text-sm font-bold uppercase tracking-widest mb-3">Mínimo de Asistencias</p>
                          <p className="text-6xl font-black text-white">{colD_val}</p>
                        </div>
                        <div className="bg-gradient-to-br from-emerald-400 to-green-600 rounded-[2.5rem] p-10 shadow-xl text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform">
                          <p className="text-emerald-100 text-sm font-bold uppercase tracking-widest mb-3">Asistencias Realizadas</p>
                          <p className="text-6xl font-black text-white">{colE_val}</p>
                        </div>
                      </div>

                      {/* Fila 3: Calidad y Metas (3 columnas) */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-[#3C1053] rounded-[2.5rem] p-10 shadow-2xl text-center transform hover:-translate-y-2 transition-transform">
                          <p className="text-fuchsia-200 text-sm font-bold uppercase tracking-widest mb-3 text-balance">Calificación del Cliente</p>
                          <p className="text-6xl font-black text-[#00E5FF]">{colG_val}</p>
                        </div>
                        <div className="bg-white dark:bg-slate-800 border-4 border-indigo-100 dark:border-slate-700 rounded-[2.5rem] p-10 shadow-lg text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform">
                          <p className="text-indigo-400 dark:text-indigo-300 text-sm font-bold uppercase tracking-widest mb-3">Meta de Llamadas</p>
                          <p className="text-6xl font-black text-[#3C1053] dark:text-white">50</p>
                        </div>
                        <div className="bg-white dark:bg-slate-800 border-4 border-[#FF00FF]/20 dark:border-[#FF00FF]/30 rounded-[2.5rem] p-10 shadow-lg text-center flex flex-col justify-center transform hover:-translate-y-1 transition-transform">
                          <p className="text-[#C51162] dark:text-pink-400 text-sm font-bold uppercase tracking-widest mb-3">Llamadas que llevo</p>
                          <p className="text-6xl font-black text-[#3C1053] dark:text-white">{colF_val}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })()
            ) : (
              <div className="text-center py-10 text-gray-500 font-bold">La hoja 'dashboard' está vacía o no tiene el formato correcto.</div>
            )}
          </div>
        );
      };

      // ============================================================
      // LLAMADAS (AZUL)
      // ============================================================
      const renderAzulTable = () => {
        const formatMax3 = (val) => {
          if (typeof val === 'number') return Number.isInteger(val) ? val : parseFloat(val.toFixed(3));
          if (typeof val === 'string' && !isNaN(val) && val.includes('.')) return parseFloat(parseFloat(val).toFixed(3));
          return val;
        };

        const textosLlamadas = [
          { num: "1.1", text: "Saludo correcto: Speech autorizado. Valor: 5 puntos" },
          { num: "2.1", text: "Solicitud de datos de contacto y validación de identidad. Valor: 7 puntos" },
          { num: "2.2", text: "Confirmación de titularidad y resguardo de datos sensibles. Valor: 8 puntos" },
          { num: "3.1", text: "Escucha activa y comprensión del problema. Valor: 10 puntos" },

                                  <tr key={idx} className="border-b border-gray-100 dark:border-slate-700 hover:bg-gray-50/50 dark:hover:bg-slate-700/30 transition-colors group">
                                    <td colSpan="2" className="p-3 border-r border-gray-200 dark:border-slate-700">
                                      <div className="flex items-center space-x-4 bg-white dark:bg-slate-800 p-3 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-sm group-hover:border-[#FF00FF] group-hover:shadow-md transition-all cursor-default max-w-sm ml-2">
                                        <div className="w-12 h-12 flex-shrink-0 bg-gradient-to-br from-[#3C1053] to-[#7B1FA2] rounded-xl flex items-center justify-center shadow-inner group-hover:from-[#C51162] group-hover:to-[#FF00FF] transition-colors duration-300">
                                          <span className="text-white font-black text-[11px] text-center whitespace-nowrap">{criteriaData.num}</span>
                                        </div>
                                        <span className="text-[13px] font-medium text-gray-700 dark:text-gray-300 leading-snug">{criteriaData.text}</span>
                                      </div>
                                    </td>
                                    {[5, 9, 13, 17].map((startIdx, i) => (
                                      <React.Fragment key={i}>
                                        {[0, 1, 2].map(offset => (
                                          <td key={offset} className="text-center font-bold text-gray-700 dark:text-gray-300 border-r border-gray-100 dark:border-slate-700 p-3 bg-white dark:bg-slate-800/50">
                                            {formatMax3(row[startIdx + offset])}
                                          </td>
                                        ))}
                                        {i < 3 && <td className="w-2 bg-gray-100 dark:bg-slate-900"></td>}
                                      </React.Fragment>
                                    ))}
                                  </tr>
                                )
                              })}

                              <tr className="bg-[#f8e1ec] dark:bg-pink-900/40 border-t-[4px] border-pink-300 dark:border-pink-500/50">
                                <td colSpan="2" className="p-5 border-r border-pink-200 dark:border-pink-800 font-black text-[#3C1053] dark:text-pink-100 text-right uppercase tracking-wider text-sm">
                                  Puntaje total por chat
                                </td>
                                {[5, 9, 13, 17].map((startIdx, i) => (
                                  <React.Fragment key={i}>
                                    {[0, 1, 2].map(offset => (
                                      <td key={offset} className="text-center font-black text-[#3C1053] dark:text-pink-100 border-r border-pink-200 dark:border-pink-800 p-3 text-lg">
                                        {formatMax3(totalCallRow[startIdx + offset])}
                                      </td>
                                    ))}
                                    {i < 3 && <td className="w-2 bg-gray-100 dark:bg-slate-900 border-r border-pink-200 dark:border-pink-800"></td>}
                                  </React.Fragment>
                                ))}
                              </tr>

                              <tr className="bg-[#3C1053] dark:bg-[#2A0B3A] border-t-[6px] border-[#C51162]">
                                <td colSpan="2" className="p-6 border-r border-pink-900/50 font-black text-white text-right uppercase tracking-widest text-sm">
                                  Puntaje total por semana
                                </td>
                                {[5, 9, 13, 17].map((startIdx, i) => {
                                  let val = totalWeekRow[startIdx] || totalWeekRow[startIdx + 1] || totalWeekRow[startIdx + 2];
                                  if (typeof val === 'number') { val = parseFloat((val * 100).toFixed(2)) + '%'; }
                                  return (
                                    <React.Fragment key={i}>
                                      <td colSpan="3" className="text-center font-black text-[#FF0000] dark:text-red-500 p-5 text-2xl border-r border-pink-900/50 tracking-wider shadow-inner bg-black/10">
                                        {val}
                                      </td>
                                      {i < 3 && <td className="w-2 bg-gray-800 dark:bg-slate-900 border-r border-pink-900/50"></td>}
                                    </React.Fragment>
                                  )
                                })}
                              </tr>
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  );
                } catch (error) {
                  return <div className="text-center font-bold text-red-500 p-10 bg-red-50 rounded-2xl border border-red-200 m-10">Ocurrió un error al procesar la tabla: <br /> <strong>{error.message}</strong></div>;
                }
              })()
            )}
            
            <style>{`
              .custom-scrollbar::-webkit-scrollbar { height: 12px; }
              .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
              .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 3px solid #f1f5f9; }
              .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #FF00FF; }
              .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
              .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border: 3px solid #0f172a; }
            `}</style>
          </div>
        );
      };

      // ============================================================
      // RENDER PRINCIPAL
      // ============================================================
      return (
        <div className={`${isDarkMode ? 'dark' : ''}`}>
          {/* Bloqueador de Interacción (Modal) */}
          {!isAuthenticated && renderLoginModal()}

          {/* El Dashboard se desenfoca y bloquea si no está autenticado */}
          <div className={`min-h-screen bg-[#FDFDFF] dark:bg-slate-900 font-sans selection:bg-cyan-100 selection:text-[#3C1053] transition-all duration-300 ${!isAuthenticated ? 'blur-md pointer-events-none select-none opacity-60' : ''}`}>

            {/* Navbar */}
            <nav className="bg-[#3C1053] dark:bg-slate-950 py-6 px-8 sticky top-0 z-50 shadow-2xl print:hidden transition-colors">
              <div className="max-w-7xl mx-auto flex justify-between items-center px-4">
                <div className="flex items-center cursor-pointer" onClick={() => setActiveTab('home')}>
                  <div className="flex flex-col">
                    <span className="text-white text-4xl font-bold lowercase tracking-tighter leading-none">
                      dalefon<span className="text-[12px] relative -top-3 font-black">®</span>
                    </span>
                    <span className="text-cyan-400 text-[10px] font-bold tracking-[0.25em] uppercase mt-1.5 ml-1">
                      la telefonía morada
                    </span>
                  </div>
                </div>
                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="text-white p-2 rounded-full hover:bg-white/20 transition-all focus:outline-none"
                  title={isDarkMode ? "Cambiar a modo claro" : "Cambiar a modo oscuro"}
                >
                  {isDarkMode ? <Sun size={24} /> : <Moon size={24} />}
                </button>
              </div>
            </nav>

            {/* Main Views */}
            <main className="py-12">
              {activeTab === 'home' && renderHome()}
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'azul' && renderAzulTable()}
              {activeTab === 'rosa' && renderRosaTable()}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
